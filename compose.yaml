services:
  ctf-rpg:
    image: ctf-rpg:local
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in the root .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_EXECUTION: ${DATABASE_EXECUTION:-main}
    volumes:
      - quest-data:/app/data
      - ./content:/app/content:ro
      - ./public:/app/public:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
volumes:
  # Keep the existing volume name for compatibility with prior installations.
  quest-data:
