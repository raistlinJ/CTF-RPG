# Beginner practice mission; import with demo-theme.json.
# Public example answers are not suitable for a graded assessment.
challenges:
  - id: sv-demo-v1-starter
    map: town
    location:
      x: 18
      y: 19
    object: Beacon battery
    region: Lumen City
    text: The Aurora Beacon needs two red and two green power cells. How many cells are needed in total?
      Answer with a number to earn the red key.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - "4"
      - four
    caseSensitive: false
    points: 100
    hints:
      - id: starter-nudge
        label: Count the cells
        text: Add two and two.
        cost: 10
    downloads: []
    discoveryVideo: /videos/solstice-vanguard/beacon-welcome.mp4
    dependsOn: []
    rewards:
      keys:
        - red
      incantations: []
  - id: sv-demo-v1-phrase
    map: town
    location:
      x: 11
      y: 19
    object: Aurora signal
    region: Lumen City
    text: What do we call the colorful lights that can dance in the northern night sky? Answer with one
      word to learn the shortcut incantation.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - aurora
      - the aurora
    caseSensitive: false
    points: 75
    hints:
      - id: phrase-nudge
        text: The word starts with A.
        cost: 0
    downloads: []
    dependsOn: []
    rewards:
      keys: []
      incantations:
        - northern glow
  - id: sv-demo-v1-small-boss
    map: toy-workshop
    location:
      x: 15
      y: 15
    object: Parcel Drone
    region: Gift Foundry
    text: A gift tag says FRAGILE. Should the drone drop the parcel or carry it carefully? Answer with
      two words to earn the gold key.
    grading: automatic
    visibility: visible
    icon: boss
    bossStyle: clockwork
    iconSize: 1
    flags:
      - carry carefully
      - carried carefully
    caseSensitive: false
    points: 125
    hints:
      - id: small-nudge
        text: Fragile things need gentle handling.
        cost: 10
    downloads: []
    solveVideo: /videos/solstice-vanguard/parcel-drone-solved.mp4
    dependsOn:
      - sv-demo-v1-starter
    rewards:
      keys:
        - gold
      incantations: []
  - id: sv-demo-v1-bonus
    map: bakery
    location:
      x: 20
      y: 12
    object: Cocoa counter
    region: Cocoa Café
    text: The café serves five cocoa mugs, then three more. How many mugs were served? This optional
      challenge can award a green key.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - "8"
      - eight
    caseSensitive: false
    points: 50
    hints:
      - id: bonus-free
        label: Free nudge
        text: Add the first order and the second order.
        cost: 0
      - id: bonus-answer
        label: Reveal answer (gives up bonus key)
        text: The answer is 8.
        cost: 5
        rewardCost:
          keys:
            - green
          incantations: []
    downloads: []
    dependsOn: []
    rewards:
      keys:
        - green
      incantations: []
  - id: sv-demo-v1-memory
    map: cocoa-cottage
    location:
      x: 20
      y: 12
    object: Comet code
    region: Comet Archives
    text: The archive code reads A, B, C, __. Which letter comes next?
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - D
    caseSensitive: false
    points: 75
    hints:
      - id: memory-nudge
        text: Say the first four letters of the alphabet.
        cost: 5
    downloads: []
    dependsOn: []
    rewards:
      keys: []
      incantations: []
  - id: sv-demo-v1-file
    map: post-office
    location:
      x: 20
      y: 12
    object: Beacon dispatch
    region: Signal Station
    text: Download the Signal Station dispatch and copy its completion flag exactly, including capital
      letters and braces.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - FLAG{BEACON}
    caseSensitive: true
    points: 100
    hints:
      - id: file-nudge
        text: Find the line that starts with FLAG{.
        cost: 10
    downloads:
      - name: Beacon dispatch
        url: /downloads/solstice-demo-dispatch.txt
        filename: solstice-demo-dispatch.txt
    dependsOn: []
    rewards:
      keys: []
      incantations: []
  - id: sv-demo-v1-medium-boss
    map: elf-house
    location:
      x: 20
      y: 12
    object: Crystal Sentinel
    region: Evergreen Vault
    text: A tree that keeps green needles through winter is called what? Answer with one word.
    grading: automatic
    visibility: visible
    icon: boss
    bossStyle: frost
    iconSize: 2
    flags:
      - evergreen
    caseSensitive: false
    points: 150
    hints:
      - id: medium-nudge
        text: The same word appears in this vault’s name.
        cost: 15
    downloads: []
    dependsOn:
      - sv-demo-v1-small-boss
      - sv-demo-v1-phrase
    rewards:
      keys:
        - purple
      incantations: []
  - id: sv-demo-v1-final-boss
    map: castle
    location:
      x: 19
      y: 10
    object: Frost Eclipse
    region: Aurora Beacon
    text: The beacon flashes red, green, gold, red, green, __. Which color comes next?
    grading: automatic
    visibility: visible
    icon: boss
    bossStyle: boss-frost-eclipse
    iconSize: 3
    flags:
      - gold
    caseSensitive: false
    points: 200
    hints:
      - id: final-nudge
        text: The three-color pattern repeats.
        cost: 20
    downloads: []
    dependsOn:
      - sv-demo-v1-medium-boss
      - sv-demo-v1-file
    rewards:
      keys:
        - silver
      incantations:
        - lumen shines
  - id: sv-demo-v1-reflection
    map: castle
    location:
      x: 25
      y: 18
    object: Team reflection
    region: Aurora Beacon
    text: In one sentence, describe how you checked a clue before deciding what to do next. Your
      instructor will review this written answer.
    grading: manual
    visibility: visible
    icon: star
    iconSize: 1
    flags: []
    caseSensitive: false
    points: 50
    hints:
      - id: reflection-guide
        text: Name a clue and explain how you confirmed its meaning.
        cost: 0
    downloads: []
    dependsOn:
      - sv-demo-v1-final-boss
    rewards:
      keys: []
      incantations: []
  - id: sv-demo-v1-hidden-example
    map: town
    location:
      x: 29
      y: 8
    object: Hidden star practice
    region: Lumen City
    text: "Optional instructor example: A festive star has five points. How many points does it have?"
    grading: automatic
    visibility: hidden
    icon: star
    iconSize: 1
    flags:
      - "5"
      - five
    caseSensitive: false
    points: 25
    hints: []
    downloads: []
    dependsOn: []
    rewards:
      keys: []
      incantations: []
