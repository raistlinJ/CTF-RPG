# Public practice adventure. Replace flags and IDs before a graded holiday event.
challenges:
  - id: dh-holiday-v1-signal
    map: town
    location:
      x: 18
      y: 20
    object: 01 · The Winter Signal
    region: Doomstadt Winter Square
    text: >-
      Winter Guard Captain asks you to recover the opening signal. Decode this
      hexadecimal ASCII message, then submit the result exactly.


      `46 4c 41 47 7b 48 4f 4c 49 44 41 59 7d`


      This is a local practice puzzle; no network target is involved.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - FLAG{HOLIDAY}
    caseSensitive: true
    points: 100
    hints:
      - id: signal-hex
        label: Hex to text
        text: Each two-digit hexadecimal number represents one ASCII character. For
          example, 46 is F and 4c is L.
        cost: 0
    downloads: []
    dependsOn:
      - npe:dh-captain:briefing
    rewards:
      keys: []
      incantations: []
  - id: dh-holiday-v1-manifest
    map: town
    location:
      x: 11
      y: 18
    object: 02 · The Misrouted Parcel
    region: Doomstadt Winter Square
    text: Download the gift manifest. Find the parcel whose destination is LATVERIA
      and whose status is MISROUTED. Submit the flag in that row.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - FLAG{RETURN_TO_SENDER}
    caseSensitive: true
    points: 100
    hints:
      - id: manifest-nudge
        label: Free nudge
        text: Read the task carefully and preserve the exact FLAG{...} format.
        cost: 0
    downloads:
      - name: Gift manifest (CSV)
        url: /downloads/doom-holiday/gift-manifest.csv
        filename: gift-manifest.csv
    dependsOn:
      - dh-holiday-v1-signal
    rewards:
      keys: []
      incantations: []
  - id: dh-holiday-v1-gift-code
    map: toy-workshop
    location:
      x: 20
      y: 12
    object: 03 · The Gift Terminal
    region: Doombot Gift Foundry
    text: |-
      Decode the Base64 string on the gift terminal:

      `RkxBR3tHSUZUX0ZPUkdFfQ==`

      A correct answer releases the **red key** for the Aurora Reactor Vault.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - FLAG{GIFT_FORGE}
    caseSensitive: true
    points: 100
    hints:
      - id: gift-base64
        label: Decode Base64
        text: "Use a local Base64 decoder. On macOS or Linux: printf %s
          RkxBR3tHSUZUX0ZPUkdFfQ== | base64 -d. The output is the complete
          flag."
        cost: 0
    downloads: []
    dependsOn:
      - dh-holiday-v1-signal
    rewards:
      keys:
        - red
      incantations: []
  - id: dh-holiday-v1-parcel-sentry
    map: toy-workshop
    location:
      x: 18
      y: 17
    object: 04 · Parcel Sentry
    region: Doombot Gift Foundry
    text: |-
      The Doombot prints four binary ASCII bytes:

      `01000100 01001111 01001111 01001101`

      Decode the word and wrap it as `FLAG{WORD}`.
    grading: automatic
    visibility: visible
    icon: boss
    iconSize: 1
    flags:
      - FLAG{DOOM}
    caseSensitive: true
    points: 150
    hints:
      - id: parcel-sentry-nudge
        label: Free nudge
        text: Read the task carefully and preserve the exact FLAG{...} format.
        cost: 0
    downloads: []
    dependsOn:
      - dh-holiday-v1-gift-code
    rewards:
      keys: []
      incantations: []
    bossStyle: boss-holiday-doombot
