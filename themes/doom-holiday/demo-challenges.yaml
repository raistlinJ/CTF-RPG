  - id: dh-holiday-v1-snowglobe
    map: cocoa-cottage
    location:
      x: 20
      y: 13
    object: 07 · Strange’s Snowglobe
    region: Snowglobe Sanctum
    text: >-
      The snowglobe uses a Caesar shift of **+3**. Undo the shift on letters
      only:


      `IODJ{ZLQWHU_VSDUN}`


      Braces and underscores remain unchanged.
    grading: automatic
    visibility: visible
    icon: star
    iconSize: 1
    flags:
      - FLAG{WINTER_SPARK}
    caseSensitive: true
    points: 100
    hints:
      - id: snowglobe-shift
        label: Shift backwards
        text: "Move each letter three places backwards: I becomes F, O becomes L, D
          becomes A, and J becomes G."
        cost: 0
    downloads: []
    dependsOn:
      - dh-holiday-v1-signal
    rewards:
      keys: []
      incantations: []
