  - id: dh-holiday-v1-power
    map: elf-house
    location:
      x: 20
      y: 12
    object: 10 · Aurora Power Budget
    region: Aurora Reactor Vault
    text: >-
      The reactor reads `00011001` in binary. Convert it to decimal, then submit
      `FLAG{NUMBER_WATTS}`. For example, a reading of 3 would use FLAG{3_WATTS}.


