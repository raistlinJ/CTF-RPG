# Server-only definitions. Flags and locked hint text are never sent to the browser.
# Coordinates: x=0..39, y=0..27. See CHALLENGES.md for fields and scoring.
challenges:
  - id: lantern
    object: Lost lantern
    location: { x: 11, y: 19 }
    region: Lantern Lane
    text: |
      An elf packs 6 boxes with 4 gifts in each. How many gifts are there?
      You can download the packing list for a closer look.
    flags: ["24", "twenty four", "twenty-four"]
    caseSensitive: false
    points: 100
    hints:
      - id: multiply
        label: A nudge
        text: "Multiply the number of boxes by the gifts in each box."
        cost: 10
      - id: groups
        label: Another way to count
        text: "Add 4 six times: 4 + 4 + 4 + 4 + 4 + 4."
        cost: 20
    downloads:
      - name: Elf's packing list
        url: /downloads/packing-list.txt
        filename: packing-list.txt
  - id: compass
    object: Silver compass
    location: { x: 32, y: 20 }
    region: Frostbite Lake
    text: "Which direction is opposite to north?"
    flags: ["south", "s"]
    caseSensitive: false
    points: 100
    hints:
      - id: directions
        text: "Think of the four compass directions."
        cost: 0
  - id: bell
    object: Sleigh bell
    location: { x: 8, y: 8 }
    region: Evergreen Grove
    text: "What is the next number: 3, 6, 9, 12, ...?"
    flags: ["15", "fifteen"]
    caseSensitive: false
    points: 150
    hints:
      - id: sequence
        text: "The sequence increases by the same amount each time."
        cost: 15
  - id: star
    object: Northern star
    location: { x: 29, y: 8 }
    region: Aurora Ridge
    text: "Water freezes at what temperature in degrees Celsius?"
    flags: ["0", "zero", "0 c", "0°C"]
    caseSensitive: true
    points: 150
    hints:
      - id: temperature
        text: "It is the temperature between positive and negative numbers."
        cost: 15
  - id: present
    object: Secret present
    map: castle
    location: { x: 20, y: 10 }
    region: Santa's Christmas Castle
    text: "Which planet is known as the Red Planet?"
    flags: ["mars"]
    caseSensitive: false
    points: 200
    hints:
      - id: planet
        text: "It is the fourth planet from the Sun."
        cost: 20
  - id: ribbon
    object: Lost gift ribbon
    map: toy-workshop
    location: { x: 15, y: 15 }
    region: Toy Workshop
    text: "An elf wraps 5 presents each hour. How many presents are wrapped in 3 hours?"
    flags: ["15", "fifteen"]
    points: 75
    hints:
      - id: wrapping
        text: "Multiply presents per hour by the number of hours."
        cost: 5
  - id: cookie
    object: Gingerbread cookie
    map: bakery
    location: { x: 20, y: 12 }
    region: Gingerbread Bakery
    text: "The baker has 3 star cookies and 5 snowflake cookies. How many cookies are there altogether?"
    flags: ["8", "eight"]
    points: 50
    hints:
      - id: cookies
        text: "Add the two groups together."
        cost: 0
