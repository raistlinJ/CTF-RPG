# Coordinates are tile positions: x=0..39, y=0..27. See README.md.
challenges:
  - id: lantern
    object: Lost lantern
    location: { x: 11, y: 19 }
    region: Lantern Lane
    prompt: "An elf packs 6 boxes with 4 gifts in each. How many gifts are there?"
    answers: ["24", "twenty four", "twenty-four"]
    points: 100
    hint: "Multiply the number of boxes by the gifts in each box."
  - id: compass
    object: Silver compass
    location: { x: 32, y: 20 }
    region: Frostbite Lake
    prompt: "Which direction is opposite to north?"
    answers: ["south", "s"]
    points: 100
    hint: "Think of the four compass directions."
  - id: bell
    object: Sleigh bell
    location: { x: 8, y: 8 }
    region: Evergreen Grove
    prompt: "What is the next number: 3, 6, 9, 12, ...?"
    answers: ["15", "fifteen"]
    points: 150
    hint: "The sequence increases by the same amount each time."
  - id: star
    object: Northern star
    location: { x: 29, y: 8 }
    region: Aurora Ridge
    prompt: "Water freezes at what temperature in degrees Celsius?"
    answers: ["0", "zero", "0 c", "0°c"]
    points: 150
    hint: "It is the temperature between positive and negative numbers."
  - id: present
    object: Secret present
    location: { x: 20, y: 7 }
    region: Santa's Workshop
    prompt: "Which planet is known as the Red Planet?"
    answers: ["mars"]
    points: 200
    hint: "It is the fourth planet from the Sun."
