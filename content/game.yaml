# Server-only configuration. Never put this file in public/.
admin:
  # Required for local startup: protectedUsername must match a role: admin account below.
  # Set this in your private GAME_CONFIG file (for example, protectedUsername: teacher01).
  # Trusted Sites sign-in email allowlist. Ignored by the standalone server.
  platformEmails: ["jaime.acosta1@gmail.com"]
characters:
  - id: web
    name: Web Ranger
    subtitle: Quick feet. Curious mind.
    sprite: null # e.g. /sprites/web.png (a transparent, single-frame image)
    fallback: web
  - id: thunder
    name: Thunder Knight
    subtitle: A storm of determination.
    sprite: null
    fallback: thunder
  - id: shield
    name: Shield Sentinel
    subtitle: Bravery in every step.
    sprite: null
    fallback: shield
  - id: frost-alchemist
    name: Frost Alchemist
    subtitle: Mix courage with a little winter magic.
    sprite: /sprites/frost-alchemist.png
    fallback: web
    appearanceFor: player
  - id: aurora-scout
    name: Aurora Scout
    subtitle: Find a bright path through the snow.
    sprite: /sprites/aurora-scout.png
    fallback: web
    appearanceFor: player
  - id: ember-tinkerer
    name: Ember Tinkerer
    subtitle: Fix the impossible, one gear at a time.
    sprite: /sprites/ember-tinkerer.png
    fallback: thunder
    appearanceFor: player
  - id: glacier-guardian
    name: Glacier Guardian
    subtitle: Stand firm when the trail gets tough.
    sprite: /sprites/glacier-guardian.png
    fallback: shield
    appearanceFor: player
  - id: starlight-bard
    name: Starlight Bard
    subtitle: Every mystery deserves a song.
    sprite: /sprites/starlight-bard.png
    fallback: web
    appearanceFor: player
  - id: snowbound-librarian
    name: Snowbound Librarian
    subtitle: Keeper of hidden stories.
    sprite: /sprites/snowbound-librarian.png
    fallback: web
    appearanceFor: entity
  - id: clockwork-toymaker
    name: Clockwork Toymaker
    subtitle: Builder of curious inventions.
    sprite: /sprites/clockwork-toymaker.png
    fallback: thunder
    appearanceFor: entity
  - id: aurora-oracle
    name: Aurora Oracle
    subtitle: Reads the colors in the sky.
    sprite: /sprites/aurora-oracle.png
    fallback: shield
    appearanceFor: entity
  - id: pine-ranger
    name: Pine Ranger
    subtitle: Knows every winding woodland path.
    sprite: /sprites/pine-ranger.png
    fallback: web
    appearanceFor: entity
  - id: gingerbread-chef
    name: Gingerbread Chef
    subtitle: Serves a warm welcome.
    sprite: /sprites/gingerbread-chef.png
    fallback: thunder
    appearanceFor: entity
accounts:
  allowRegistration: true # Set false for admin-created or listed users only. Admin UI overrides this after saving.
  users: []
  # users:
  #   - username: student01
  #     password: replace-with-a-unique-password
  #     hero: thunder # Optional. Omit to let the student choose on first sign-in.
  #     role: admin # Give this account administrator access.
audio:
  midi: /audio/north-pole.mid # Replace with your own MIDI in public/audio/.
  loop: true
  volume: 0.15

# Initial team capacity; the admin Teams page overrides this in the database.
teams:
  maxMembers: 4
