# Optional CTF-RPG HTTPS frontend — Copyright (c) 2026 Jaime C Acosta
services:
  ctf-rpg:
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
      SECURE_COOKIES: "true"
  nginx:
    build: ./nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost}
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:-}
      NGINX_ENVSUBST_FILTER: "^PUBLIC_ORIGIN$$"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      ctf-rpg:
        condition: service_healthy
    restart: unless-stopped
